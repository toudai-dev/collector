# Product gateway: OTLP in, key validation, gateway-resolved dataset and
# gateway-assigned event IDs, owned toudai exporter out. One deployment serves
# one customer (Decision 0002); nothing here knows a tenant or workspace.
#
# Producers send an ingestion key in the X-Toudai-Key header and may name the
# dataset in X-Toudai-Dataset:
#
#   curl -H 'X-Toudai-Key: <key>' -H 'Content-Type: application/json' \
#        --data @logs.json http://localhost:4318/v1/logs
#
# The dataset is the X-Toudai-Dataset header, else the key's only dataset, else
# toudaigateway's default_dataset (Decision 0002 D3).
#
# Responses: 401 for a missing, unknown, read-only, or repeated key, or a blank
# or repeated dataset header (authentication fails before any pipeline runs);
# 403 for a dataset outside the key's list; 400 when no dataset can be
# resolved, the dataset name is invalid, a resource's toudai.dataset differs
# from the resolved dataset, a resource sets any other reserved toudai.*
# attribute, or a record carries its own toudai.event_id. None are retryable.

extensions:
  toudaiauth:
    keys_file: ${env:TOUDAI_KEYS_FILE:-config/keys.example.yaml}

receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:TOUDAI_OTLP_HTTP_ENDPOINT:-0.0.0.0:4318}
        auth:
          authenticator: toudaiauth
      grpc:
        endpoint: ${env:TOUDAI_OTLP_GRPC_ENDPOINT:-0.0.0.0:4317}
        auth:
          authenticator: toudaiauth

processors:
  # Sets toudai.dataset from the request and the authenticated key, and assigns
  # every record its event_id. It must stay ahead of anything that batches: the
  # dataset is per request and a batch can mix requests.
  # Batching in this distribution is the exporter's sending_queue batch below,
  # which runs after the processor; if a batch processor is ever added, list it
  # after toudaigateway.
  toudaigateway:
    # Empty means no default: a request that names no dataset and whose key is
    # not restricted to exactly one is refused.
    default_dataset: ${env:TOUDAI_DEFAULT_DATASET:-}

exporters:
  toudai:
    endpoint: ${env:TOUDAI_CLICKHOUSE_ENDPOINT:-127.0.0.1:9000}
    # Decision 0002 D1: the database is configuration. Apply the DDL with the
    # same name: clickhouse-client --param_database=<name>.
    database: ${env:TOUDAI_CLICKHOUSE_DATABASE:-toudai}
    username: ${env:TOUDAI_CLICKHOUSE_USERNAME:-default}
    password: ${env:TOUDAI_CLICKHOUSE_PASSWORD:-}
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      batch:
        sizer: items
        min_size: 1000
        flush_timeout: 1s

service:
  extensions: [toudaiauth]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [toudaigateway]
      exporters: [toudai]
    traces:
      receivers: [otlp]
      processors: [toudaigateway]
      exporters: [toudai]
