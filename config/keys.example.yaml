# Static ingestion keys for the product gateway (toudaiauth extension).
#
# One deployment serves one customer (Decision 0002), so a key maps to
# permissions, never to a customer or workspace: whether it may write, and
# optionally which datasets. A key without a datasets field may write to any
# dataset; an explicit empty list is refused at start. Rotation and revocation
# are file edits plus a restart until a key store replaces this file.
#
# A request's dataset is the X-Toudai-Dataset header, else the key's only
# dataset, else the gateway's default_dataset. A dataset outside the key's list
# fails the request, whichever of the three named it.
#
# These values are synthetic examples. Generate real keys with at least 128 bits
# of entropy, keep this file out of version control, and mount it read-only.
keys:
  tk_example_prod_only_0123456789abcdef:
    # A key restricted to exactly one dataset writes there without a header.
    datasets: [prod]
    write: true
  tk_example_prod_staging_0123456789abcd:
    # A key restricted to several datasets names one with X-Toudai-Dataset, or
    # writes to default_dataset when that is in its list.
    datasets: [prod, staging]
    write: true
  tk_example_any_dataset_0123456789abcde:
    # No datasets list: any dataset, by header or default_dataset.
    write: true
  tk_example_readonly_0123456789abcdef:
    datasets: [prod]
    # Keys without write permission are rejected at ingestion.
    write: false
