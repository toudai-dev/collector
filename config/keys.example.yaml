# Static ingestion keys for the product gateway (toudaiauth extension).
#
# Each key maps to exactly one workspace, the datasets it may write, and whether
# it may write at all. The workspace is never taken from producer data: whatever
# a key maps to here is what lands on every record sent with it. A workspace may
# have several keys (for example one per environment, or an old and a new key
# during rotation); rotation and revocation are file edits plus a restart until
# dynamic resolution exists.
#
# These values are synthetic examples. Generate real keys with at least 128 bits
# of entropy, keep this file out of version control, and mount it read-only.
keys:
  tk_example_ws_a_prod_0123456789abcdef:
    workspace_id: 11111111-1111-4111-8111-111111111111
    # A key scoped to exactly one dataset writes there without a dataset header.
    datasets: [prod]
    write: true
  tk_example_ws_a_multi_0123456789abcdef:
    workspace_id: 11111111-1111-4111-8111-111111111111
    # A key scoped to several datasets must name one per request with the
    # X-Toudai-Dataset header; a name outside this list fails the request.
    datasets: [prod, staging]
    write: true
  tk_example_ws_b_prod_0123456789abcdef:
    workspace_id: 22222222-2222-4222-8222-222222222222
    datasets: [prod]
    write: true
  tk_example_ws_a_readonly_0123456789ab:
    workspace_id: 11111111-1111-4111-8111-111111111111
    datasets: [prod]
    # Keys without write permission are rejected at ingestion.
    write: false
